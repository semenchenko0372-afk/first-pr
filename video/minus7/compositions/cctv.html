  <script>
    (function () {
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const cv = document.getElementById("cc-noise");
      const ctx = cv.getContext("2d");
      const img = ctx.createImageData(cv.width, cv.height);
      const timeEl = document.getElementById("cc-time");
      let lastF = -1, lastS = -1;
      function draw(t) {
        const f = Math.floor(t * 24);
        if (f !== lastF) {
          lastF = f;
          const r = rng(4242 + f * 131);
          const d = img.data;
          for (let i = 0; i < d.length; i += 4) { const v = (r() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
          ctx.putImageData(img, 0, 0);
        }
        // The clock on the tape: 23:47:03 when the scene opens, ticking with it.
        const s = 3 + Math.floor(t);
        if (s !== lastS) { lastS = s; timeEl.textContent = "23:47:" + String(s).padStart(2, "0"); }
      }
      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: 13, duration: 13, ease: "none", onUpdate: () => draw(st.t) }, 0);
      tl.fromTo("#cc-roll", { y: 0 }, { y: 820, duration: 2.6, ease: "none", repeat: 4 }, 0);
      for (let k = 0; k < 13; k++) {
        tl.set("#cc-rec", { opacity: 1 }, k);
        tl.set("#cc-rec", { opacity: 0.15 }, k + 0.5);
      }
      // Camera: settle on the screen, punch in on the clock, then on you.
      tl.fromTo("#cc-cam", { scale: 1.0, transformOrigin: "540px 640px" }, { scale: 1.08, duration: 2.3, ease: "power1.inOut" }, 0);
      tl.set("#cc-cam", { scale: 2.2, transformOrigin: "300px 940px" }, 2.4);
      tl.to("#cc-cam", { scale: 2.5, duration: 3.7, ease: "none" }, 2.4);
      tl.set("#cc-cam", { scale: 1.55, transformOrigin: "600px 690px" }, 6.1);
      tl.to("#cc-cam", { scale: 1.65, duration: 2.0, ease: "none" }, 6.1);
      // The glitch: the tape tears, and someone is standing there.
      const tears = [[8.1, 22], [8.16, -30], [8.22, 12], [8.3, -8], [8.38, 0]];
      tears.forEach(([t, x]) => tl.set("#cc-feed", { x }, t));
      tl.set("#cc-flash", { opacity: 0.55 }, 8.1);
      tl.set("#cc-flash", { opacity: 0 }, 8.16);
      tl.set("#cc-flash", { opacity: 0.3 }, 8.24);
      tl.set("#cc-flash", { opacity: 0 }, 8.3);
      tl.set("#cc-fig", { opacity: 0.6 }, 8.12);
      tl.set("#cc-fig", { opacity: 0 }, 8.2);
      tl.set("#cc-fig", { opacity: 1 }, 8.28);
      tl.set("#cc-noise", { opacity: 0.5 }, 8.1);
      tl.to("#cc-noise", { opacity: 0.16, duration: 0.6 }, 8.2);
      tl.to("#cc-cam", { scale: 1.75, transformOrigin: "560px 640px", duration: 2.0, ease: "power2.out" }, 8.3);
      // Push toward it; its eyes catch the light.
      tl.to("#cc-cam", { scale: 2.6, transformOrigin: "505px 470px", duration: 2.6, ease: "power1.inOut" }, 10.6);
      tl.to("#cc-figeyes", { opacity: 1, duration: 0.25, ease: "power2.out" }, 11.9);
      draw(0);
      window.__timelines["cctv"] = tl;
    })();
  </script>
