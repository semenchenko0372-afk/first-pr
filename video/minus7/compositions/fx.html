<template>
  <style>
    #root { position: absolute; inset: 0; pointer-events: none; }
    #fx-grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: 0.11; mix-blend-mode: overlay; image-rendering: auto; }
    #fx-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 75% 60% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
    }
  </style>
  <div id="root" data-composition-id="fx" data-width="1080" data-height="1920" data-layout-ignore>
    <div id="fx-vignette"></div>
    <canvas id="fx-grain" width="360" height="640"></canvas>
  </div>
  <script>
    (function () {
      const DUR = 58.5;
      const cv = document.getElementById("fx-grain");
      const ctx = cv.getContext("2d");
      const img = ctx.createImageData(cv.width, cv.height);
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      let last = -1;
      function draw(t) {
        // Grain boils at 15 fps, like film stock on twos.
        const f = Math.floor(t * 15);
        if (f === last) return;
        last = f;
        const r = rng(9001 + f * 7919);
        const d = img.data;
        for (let i = 0; i < d.length; i += 4) {
          const v = (r() * 255) | 0;
          d[i] = d[i + 1] = d[i + 2] = v;
          d[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }
      const state = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(state.t) }, 0);
      draw(0);
      window.__timelines["fx"] = tl;
    })();
  </script>
</template>
