<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #070b16; }
    #ext-cam { position: absolute; inset: 0; }
    #ext-svg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    #ext-rain { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="exterior" data-width="1080" data-height="1920">
    <div id="ext-cam" data-layout-allow-overflow>
      <svg id="ext-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ext-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#05080f" />
            <stop offset="0.45" stop-color="#101a2e" />
            <stop offset="0.8" stop-color="#26324c" />
            <stop offset="1" stop-color="#3a3f58" />
          </linearGradient>
          <radialGradient id="ext-moonglow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#cfe0ff" stop-opacity="0.55" />
            <stop offset="0.35" stop-color="#8fa6d6" stop-opacity="0.18" />
            <stop offset="1" stop-color="#8fa6d6" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="ext-tower" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#1a2438" />
            <stop offset="0.6" stop-color="#121a2a" />
            <stop offset="1" stop-color="#0c1220" />
          </linearGradient>
          <linearGradient id="ext-side" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#090e19" />
            <stop offset="1" stop-color="#05080f" />
          </linearGradient>
          <linearGradient id="ext-road" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0b111d" />
            <stop offset="1" stop-color="#05070c" />
          </linearGradient>
          <radialGradient id="ext-warm" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.7" />
            <stop offset="0.4" stop-color="#ff9f45" stop-opacity="0.22" />
            <stop offset="1" stop-color="#ff9f45" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="ext-reflect" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffc56a" stop-opacity="0.55" />
            <stop offset="1" stop-color="#ffc56a" stop-opacity="0" />
          </linearGradient>
          <filter id="ext-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24" /></filter>
          <filter id="ext-soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" /></filter>
        </defs>

        <rect width="1080" height="1920" fill="url(#ext-sky)" />
        <circle cx="190" cy="330" r="300" fill="url(#ext-moonglow)" />
        <circle cx="190" cy="330" r="44" fill="#e6eeff" opacity="0.9" />
        <circle cx="176" cy="320" r="9" fill="#c9d5f0" opacity="0.6" /><circle cx="204" cy="346" r="6" fill="#c9d5f0" opacity="0.5" />
        <g id="ext-clouds" filter="url(#ext-soft)" opacity="0.85">
          <ellipse cx="260" cy="380" rx="280" ry="40" fill="#2a3756" />
          <ellipse cx="300" cy="220" rx="320" ry="60" fill="#141e33" />
          <ellipse cx="980" cy="420" rx="200" ry="38" fill="#18233b" />
        </g>

        <g id="ext-far"></g>
        <g id="ext-mid"></g>

        <!-- The office tower -->
        <g id="ext-towerg">
          <polygon points="800,240 880,290 880,1640 800,1640" fill="url(#ext-side)" />
          <rect x="300" y="240" width="500" height="1400" fill="url(#ext-tower)" />
          <rect x="300" y="240" width="500" height="6" fill="#2a3652" />
          <rect x="300" y="240" width="4" height="1400" fill="#5d7299" opacity="0.55" />
          <rect x="520" y="150" width="8" height="92" fill="#1a2438" />
          <circle id="ext-beacon" cx="524" cy="146" r="7" fill="#ff3b30" />
          <circle id="ext-beaconglow" cx="524" cy="146" r="22" fill="#ff3b30" opacity="0.25" filter="url(#ext-soft2)" />
          <g id="ext-windows"></g>
          <!-- the one lit window -->
          <g id="ext-lit">
            <circle cx="555" cy="1004" r="190" fill="url(#ext-warm)" />
            <rect x="530" y="972" width="50" height="64" fill="#ffcf86" />
            <rect x="530" y="972" width="50" height="22" fill="#ffe2b0" opacity="0.6" />
            <!-- desk, lamp, monitor, plant, and the last worker seen from behind -->
            <rect x="530" y="1022" width="50" height="14" fill="#7a5532" />
            <rect x="530" y="1021" width="50" height="2" fill="#a77748" />
            <rect x="560" y="1004" width="15" height="11" rx="1" fill="#1d2633" />
            <rect x="561" y="1005" width="13" height="9" fill="#cfefff" />
            <rect x="566" y="1015" width="3" height="6" fill="#1d2633" />
            <path d="M536 1021 L540 1008 L546 1008 L542 1021 Z" fill="#2b2a28" />
            <circle cx="541" cy="1007" r="3" fill="#fff4d6" />
            <path d="M574 1021 q2 -9 4 -2 q1 -7 3 1" stroke="#3f6b3a" stroke-width="2" fill="none" />
            <path d="M542 1036 C541 1016 562 1014 562 1036 Z" fill="#46603f" />
            <circle cx="552" cy="1008" r="6.5" fill="#241912" />
            <path d="M546 1005 q6 -6 12 0" stroke="#120c08" stroke-width="2.5" fill="none" />
            <rect x="529" y="971" width="52" height="66" fill="none" stroke="#2a2016" stroke-width="2" />
            <line x1="555" y1="972" x2="555" y2="1036" stroke="#2b2015" stroke-width="1.5" opacity="0.7" />
          </g>
        </g>

        <ellipse cx="540" cy="1600" rx="700" ry="90" fill="#5a6a90" opacity="0.22" filter="url(#ext-soft)" />
        <g id="ext-near"></g>

        <!-- wet street -->
        <rect x="0" y="1640" width="1080" height="280" fill="url(#ext-road)" />
        <rect x="0" y="1640" width="1080" height="3" fill="#2c3854" opacity="0.8" />
        <rect id="ext-refl" x="536" y="1650" width="36" height="260" fill="url(#ext-reflect)" filter="url(#ext-soft2)" />
        <g opacity="0.35">
          <rect x="110" y="1740" width="120" height="6" rx="3" fill="#56688f" />
          <rect x="420" y="1800" width="190" height="6" rx="3" fill="#56688f" />
          <rect x="800" y="1720" width="140" height="6" rx="3" fill="#56688f" />
        </g>
        <!-- street lamp -->
        <g>
          <rect x="930" y="1250" width="10" height="400" fill="#0a0f19" />
          <path d="M935 1250 Q935 1220 900 1220 L870 1220" stroke="#0a0f19" stroke-width="10" fill="none" />
          <rect x="850" y="1214" width="40" height="14" rx="4" fill="#0a0f19" />
          <ellipse cx="870" cy="1236" rx="120" ry="40" fill="#9fb7e8" opacity="0.12" filter="url(#ext-soft2)" />
          <polygon points="852,1228 888,1228 990,1640 750,1640" fill="#9fb7e8" opacity="0.05" />
        </g>
      </svg>
    </div>
    <canvas id="ext-rain" width="1080" height="1920"></canvas>
  </div>
  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function rect(g, x, y, w, h, fill, op) {
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", x); r.setAttribute("y", y);
        r.setAttribute("width", w); r.setAttribute("height", h);
        r.setAttribute("fill", fill);
        if (op != null) r.setAttribute("opacity", op);
        g.appendChild(r);
      }
      // Skyline layers (static, seeded).
      const r1 = rng(11);
      const far = document.getElementById("ext-far");
      for (let x = -20; x < 1100; ) {
        const w = 50 + r1() * 90, h = 260 + r1() * 420;
        rect(far, x, 1640 - h, w, h, "#0f1626");
        for (let k = 0; k < 6; k++) if (r1() < 0.5) rect(far, x + 8 + r1() * (w - 16), 1640 - h + 20 + r1() * (h - 40), 5, 7, "#6d7fa6", 0.25 + r1() * 0.3);
        x += w + 4;
      }
      const r2 = rng(23);
      const mid = document.getElementById("ext-mid");
      for (let x = -40; x < 1120; ) {
        const w = 90 + r2() * 120, h = 160 + r2() * 300;
        if (x + w < 300 || x > 880) rect(mid, x, 1640 - h, w, h, "#0b101c");
        x += w + 10;
      }
      // Tower windows: a dark grid with a few cold, dim panes.
      const r3 = rng(37);
      const win = document.getElementById("ext-windows");
      for (let row = 0; row < 16; row++) {
        for (let col = 0; col < 7; col++) {
          const x = 318 + col * 71, y = 300 + row * 84;
          if (col === 3 && row === 8) continue;
          const lit = r3() < 0.06;
          rect(win, x, y, 50, 64, lit ? "#3d5378" : "#151e31", lit ? 0.8 : 1);
          rect(win, x, y, 50, 4, "#22304a", 0.9);
        }
      }
      const r4 = rng(51);
      const near = document.getElementById("ext-near");
      rect(near, -10, 1380, 230, 270, "#070a12");
      rect(near, 900, 1460, 200, 190, "#070a12");
      for (let k = 0; k < 10; k++) rect(near, 10 + r4() * 180, 1400 + r4() * 220, 18, 22, "#1b2438", 0.8);

      // Rain, redrawn from time alone.
      const cv = document.getElementById("ext-rain");
      const ctx = cv.getContext("2d");
      const drops = [];
      const rr = rng(77);
      for (let i = 0; i < 320; i++) drops.push({ x: rr() * 1200 - 60, y0: rr() * 1920, v: 1500 + rr() * 900, l: 26 + rr() * 40, a: 0.12 + rr() * 0.28, w: rr() < 0.2 ? 2 : 1 });
      function drawRain(t) {
        ctx.clearRect(0, 0, 1080, 1920);
        ctx.lineCap = "round";
        for (const d of drops) {
          const y = (d.y0 + d.v * t) % 2000 - 40;
          const x = d.x - (y * 0.12);
          ctx.strokeStyle = "rgba(170,195,235," + d.a + ")";
          ctx.lineWidth = d.w;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - d.l * 0.12, y + d.l); ctx.stroke();
        }
      }

      const tl = gsap.timeline({ paused: true });
      const st = { t: 0 };
      tl.to(st, { t: 5.6, duration: 5.6, ease: "none", onUpdate: () => drawRain(st.t) }, 0);
      // Slow push toward the lit window.
      tl.fromTo("#ext-cam", { scale: 1.0, transformOrigin: "555px 1004px" },
        { scale: 2.6, duration: 5.6, ease: "power2.inOut" }, 0);
      tl.fromTo("#ext-clouds", { x: -30 }, { x: 40, duration: 5.6, ease: "none" }, 0);
      tl.fromTo("#ext-far", { x: 0 }, { x: 18, duration: 5.6, ease: "none" }, 0);
      // Beacon blinks once a second-ish.
      [0.2, 1.4, 2.6, 3.8, 5.0].forEach((s) => {
        tl.fromTo(["#ext-beacon", "#ext-beaconglow"], { opacity: 0.15 }, { opacity: 1, duration: 0.08 }, s);
        tl.to(["#ext-beacon", "#ext-beaconglow"], { opacity: 0.15, duration: 0.5, ease: "power2.in" }, s + 0.3);
      });
      // The lit window breathes a little (screen glow).
      tl.fromTo("#ext-lit", { opacity: 0.92 }, { opacity: 1, duration: 0.6, yoyo: true, repeat: 8, ease: "sine.inOut" }, 0);
      drawRain(0);
      window.__timelines["exterior"] = tl;
    })();
  </script>
</template>
