  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const caps = Array.from(document.querySelectorAll("#root .cap"));
      caps.forEach((el) => {
        // Split into words so they arrive one after another, softly.
        const words = el.textContent.trim().split(/\s+/);
        el.textContent = "";
        words.forEach((w, i) => {
          const s = document.createElement("span");
          s.className = "w";
          s.textContent = w + (i < words.length - 1 ? " " : "");
          el.appendChild(s);
        });
        const start = parseFloat(el.dataset.start);
        const end = start + parseFloat(el.dataset.duration);
        const ws = el.querySelectorAll(".w");
        const whisper = el.classList.contains("whisper");
        tl.set(el, { opacity: 1 }, start);
        tl.fromTo(ws, { opacity: 0, y: 14, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: whisper ? 0.5 : 0.32, ease: "power2.out",
            stagger: whisper ? 0.22 : Math.min(0.09, 0.6 / ws.length) }, start + 0.02);
        if (whisper) {
          // Shiver: small seeded offsets on a fixed 12 fps step.
          for (let k = 0; k < 20; k++) {
            const a = Math.sin(k * 12.9898) * 43758.5453;
            const fx = (a - Math.floor(a) - 0.5) * 7, fy = Math.cos(k * 4.1) * 3;
            tl.set(ws, { x: fx, rotation: fy * 0.4 }, start + 0.1 + k / 12);
          }
        }
        tl.to(el, { opacity: 0, duration: 0.14, ease: "power2.in" }, end - 0.14);
      });
      window.__timelines["captions"] = tl;
    })();
