  <div id="root" data-composition-id="floors" data-width="1080" data-height="1920">

      <svg id="flo-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">

          <radialGradient id="flo-ceil" cx="0.5" cy="0" r="0.8">
            <stop offset="0" stop-color="#eaf4ff" stop-opacity="0.5" />
            <stop offset="1" stop-color="#eaf4ff" stop-opacity="0" />

          <filter id="flo-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" /></filter>
          <filter id="flo-glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" /></filter>
        </defs>
        <rect width="1080" height="1920" fill="url(#flo-wall)" />

        <!-- ceiling light strip -->

        <rect x="140" y="60" width="800" height="26" rx="13" fill="#f4f9ff" opacity="0.6" filter="url(#flo-glow)" />

        <!-- indicator housing -->

          <polygon points="215,640 305,640 260,720" fill="#ff3b30" filter="url(#flo-glow)" opacity="0.8" />

        <g id="flo-digits-glow" filter="url(#flo-glow)" opacity="0.9"></g>

        <!-- tops of the doors below -->
        <rect x="120" y="1060" width="420" height="900" fill="url(#flo-door)" />
        <rect x="540" y="1060" width="420" height="900" fill="url(#flo-door)" />
        <rect x="536" y="1060" width="8" height="900" fill="#14181d" />
        <rect x="100" y="1030" width="880" height="30" fill="#2b3139" />
        <rect x="120" y="1060" width="840" height="900" fill="url(#flo-redspill)" opacity="0.5" />

  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      // Seven-segment geometry for a cell at (x, y), 220 wide and 380 tall.
      function segs(x, y) {
        const w = 220, h = 380, t = 34, g = 6;
        const hx = (yy) => [x + t / 2 + g, yy, x + t + g, yy - t / 2, x + w - t - g, yy - t / 2, x + w - t / 2 - g, yy, x + w - t - g, yy + t / 2, x + t + g, yy + t / 2];
        const vx = (xx, y0, y1) => [xx, y0 + g, xx + t / 2, y0 + t / 2 + g, xx + t / 2, y1 - t / 2 - g, xx, y1 - g, xx - t / 2, y1 - t / 2 - g, xx - t / 2, y0 + t / 2 + g];
        return {
          a: hx(y + t / 2), g: hx(y + h / 2), d: hx(y + h - t / 2),
          f: vx(x + t / 2, y + t / 2, y + h / 2), b: vx(x + w - t / 2, y + t / 2, y + h / 2),
          e: vx(x + t / 2, y + h / 2, y + h - t / 2), c: vx(x + w - t / 2, y + h / 2, y + h - t / 2),
        };
      }
      const MAP = { 0: "abcdef", 1: "bc", 2: "abdeg", 3: "abcdg", 4: "bcfg", 5: "acdfg", 6: "acdefg", 7: "abc", 8: "abcdefg", 9: "abcdfg" };
      const cells = [segs(380, 510), segs(650, 510)];
      const polys = { on: [], glow: [] };
      const gd = document.getElementById("flo-digits"), gg = document.getElementById("flo-digits-glow");
      cells.forEach((cell, ci) => {
        Object.keys(cell).forEach((k) => {
          const p = document.createElementNS(NS, "polygon");
          p.setAttribute("points", cell[k].join(","));
          p.dataset.cell = ci; p.dataset.seg = k;
          gd.appendChild(p);
          const q = p.cloneNode(); gg.appendChild(q);
          polys.on.push(p); polys.glow.push(q);
        });
      });
      function show(v) {
        const neg = v < 0, d = Math.abs(v);
        polys.on.forEach((p, i) => {
          const ci = +p.dataset.cell, s = p.dataset.seg;
          const lit = ci === 0 ? neg && s === "g" : MAP[d].includes(s);
          p.setAttribute("fill", lit ? "#ff3b30" : "#2a0a08");
          polys.glow[i].setAttribute("fill", lit ? "#ff3b30" : "none");
        });
      }
      // Floor numbers keyed to the narration (local seconds).
      const steps = [[0, 5], [1.81, 4], [3.79, 3], [4.8, 2], [6.62, 1], [8.0, 0], [8.45, -1], [8.8, -2], [9.1, -3], [9.35, -4], [9.55, -5]];
      function valueAt(t) { let v = steps[0][1]; for (const s of steps) if (t >= s[0]) v = s[1]; return v; }
      let last = null;
      const state = { t: 0 };
      function upd() { const v = valueAt(state.t); if (v !== last) { show(v); last = v; } }

      const tl = gsap.timeline({ paused: true });
      tl.to(state, { t: 9.7, duration: 9.7, ease: "none", onUpdate: upd }, 0);
      tl.fromTo("#flo-cam", { scale: 1.0, transformOrigin: "540px 700px" }, { scale: 1.16, duration: 9.7, ease: "power1.in" }, 0);
      // Arrow pulses each floor.
      steps.forEach((s) => {
        tl.fromTo("#flo-arrow", { opacity: 0.35 }, { opacity: 1, duration: 0.06 }, s[0]);
      });
      // Once it refuses to stop: shake, seeded, growing.
      for (let k = 0; k < 50; k++) {
        const t = 7.7 + k * 0.04;
        const a = Math.sin(k * 91.7) * 43758.5453, b = Math.sin(k * 17.3) * 23421.631;
        const amp = 2 + k * 0.28;
        tl.set("#flo-svg", { x: (a - Math.floor(a) - 0.5) * amp, y: (b - Math.floor(b) - 0.5) * amp }, t);
      }
      tl.fromTo("#flo-spill", { opacity: 0.7 }, { opacity: 1.3, duration: 1.6, ease: "power2.in" }, 8.0);
      show(5); last = 5;
      window.__timelines["floors"] = tl;
    })();
  </script>
