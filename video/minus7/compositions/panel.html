<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #4b545f; }
    #pan-cam { position: absolute; inset: 0; }
    #pan-svg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    .pan-num { font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 34px; fill: #2c333b; }
  </style>
  <div id="root" data-composition-id="panel" data-width="1080" data-height="1920">
    <div id="pan-cam" data-layout-allow-overflow>
      <svg id="pan-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="pan-wall" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3d454f" />
            <stop offset="0.35" stop-color="#6c7682" />
            <stop offset="0.55" stop-color="#7d8793" />
            <stop offset="1" stop-color="#3a414b" />
          </linearGradient>
          <linearGradient id="pan-plate" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b7c0c9" />
            <stop offset="0.5" stop-color="#8d97a2" />
            <stop offset="1" stop-color="#5f6872" />
          </linearGradient>
          <radialGradient id="pan-btn" cx="0.35" cy="0.3" r="0.8">
            <stop offset="0" stop-color="#f1f4f7" />
            <stop offset="0.55" stop-color="#b9c1ca" />
            <stop offset="1" stop-color="#6e7781" />
          </radialGradient>
          <radialGradient id="pan-top" cx="0.5" cy="0" r="0.9">
            <stop offset="0" stop-color="#fff6e0" stop-opacity="0.45" />
            <stop offset="1" stop-color="#fff6e0" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="pan-amber" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ffb648" stop-opacity="0.9" />
            <stop offset="1" stop-color="#ffb648" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="pan-gleam" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="pan-sleeve" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5d7a53" />
            <stop offset="1" stop-color="#3a5134" />
          </linearGradient>
          <filter id="pan-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-18" dy="26" stdDeviation="18" flood-color="#000" flood-opacity="0.45" /></filter>
          <filter id="pan-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" /></filter>
          <clipPath id="pan-plateclip"><rect x="300" y="200" width="480" height="920" rx="26" /></clipPath>
        </defs>
        <rect width="1080" height="1920" fill="url(#pan-wall)" />
        <g id="pan-streaks" opacity="0.18"></g>
        <rect width="1080" height="1920" fill="url(#pan-top)" />
        <!-- door seam on the left -->
        <rect x="70" y="0" width="6" height="1920" fill="#2a3038" />
        <rect x="78" y="0" width="2" height="1920" fill="#9aa4ae" opacity="0.5" />

        <!-- the panel -->
        <g filter="url(#pan-shadow)">
          <rect x="300" y="200" width="480" height="920" rx="26" fill="url(#pan-plate)" />
        </g>
        <rect x="300" y="200" width="480" height="920" rx="26" fill="none" stroke="#dfe5ea" stroke-opacity="0.6" stroke-width="3" />
        <g fill="#5a636d">
          <circle cx="330" cy="230" r="8" /><circle cx="750" cy="230" r="8" />
          <circle cx="330" cy="1090" r="8" /><circle cx="750" cy="1090" r="8" />
        </g>
        <!-- floor display -->
        <rect x="380" y="250" width="320" height="110" rx="12" fill="#120707" />
        <rect x="380" y="250" width="320" height="110" rx="12" fill="none" stroke="#3a4048" stroke-width="5" />
        <text x="540" y="333" text-anchor="middle" font-family="Space Mono, monospace" font-weight="700" font-size="76" fill="#ff3b30" opacity="0.95">12</text>
        <text x="540" y="333" text-anchor="middle" font-family="Space Mono, monospace" font-weight="700" font-size="76" fill="#ff3b30" opacity="0.4" filter="url(#pan-blur)" data-layout-ignore>12</text>
        <g id="pan-buttons"></g>
        <!-- glow ring for button 1 -->
        <circle id="pan-glow" cx="430" cy="1020" r="110" fill="url(#pan-amber)" opacity="0" />
        <circle id="pan-ring" cx="430" cy="1020" r="49" fill="none" stroke="#ffb648" stroke-width="6" opacity="0" />
        <g clip-path="url(#pan-plateclip)">
          <rect id="pan-gleamr" x="-300" y="150" width="220" height="1020" fill="url(#pan-gleam)" transform="skewX(-18)" />
        </g>

        <!-- hand: fingertip sits at the group origin -->
        <g id="pan-hand">
          <g transform="rotate(-42)">
            <rect x="-40" y="250" width="170" height="560" rx="30" fill="url(#pan-sleeve)" />
            <rect x="-46" y="232" width="182" height="60" rx="24" fill="#4a6542" />
            <!-- curled fingers sit to the right of the pointing finger -->
            <path d="M-16 118 C-20 100 6 96 30 104 L104 120 C126 126 132 150 128 176 C124 220 110 252 70 258 L-6 258 C-30 252 -34 220 -30 190 Z" fill="#dba27a" />
            <path d="M22 132 C48 128 86 134 116 146" stroke="#b47a55" stroke-width="5" fill="none" stroke-linecap="round" />
            <path d="M22 168 C50 164 88 170 122 182" stroke="#b47a55" stroke-width="5" fill="none" stroke-linecap="round" />
            <path d="M22 204 C50 200 86 206 116 216" stroke="#b47a55" stroke-width="5" fill="none" stroke-linecap="round" />
            <!-- index finger -->
            <path d="M-16 22 C-16 2 16 2 16 22 L18 140 L-18 140 Z" fill="#e3ad85" />
            <rect x="-10" y="8" width="20" height="24" rx="9" fill="#f3d1b8" />
            <path d="M-12 70 Q0 76 12 70" stroke="#c48c66" stroke-width="3" fill="none" />
            <!-- thumb wraps over the curled fingers -->
            <path d="M-34 236 C-46 200 -36 168 -8 160 C20 154 52 160 70 170 C80 178 74 190 60 190 C36 190 12 188 0 198 C-10 208 -12 230 -34 236 Z" fill="#cf946c" />
            <path d="M44 172 C58 172 70 176 72 182" stroke="#f0c9ab" stroke-width="4" fill="none" stroke-linecap="round" />
          </g>
        </g>
      </svg>
    </div>
  </div>
  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const r = rng(5);
      const st = document.getElementById("pan-streaks");
      for (let i = 0; i < 140; i++) {
        const l = document.createElementNS(NS, "rect");
        l.setAttribute("x", r() * 1080); l.setAttribute("y", 0);
        l.setAttribute("width", 1 + r() * 2); l.setAttribute("height", 1920);
        l.setAttribute("fill", r() < 0.5 ? "#ffffff" : "#000000");
        l.setAttribute("opacity", 0.2 + r() * 0.5);
        st.appendChild(l);
      }
      // Buttons 1–12, two columns, bottom to top.
      const g = document.getElementById("pan-buttons");
      for (let n = 1; n <= 12; n++) {
        const col = (n - 1) % 2, row = Math.floor((n - 1) / 2);
        const cx = 430 + col * 220, cy = 1020 - row * 120;
        const grp = document.createElementNS(NS, "g");
        if (n === 1) grp.setAttribute("id", "pan-b1");
        grp.innerHTML =
          '<circle cx="' + cx + '" cy="' + (cy + 4) + '" r="48" fill="#3f474f" opacity="0.6"/>' +
          '<circle cx="' + cx + '" cy="' + cy + '" r="46" fill="url(#pan-btn)" stroke="#59626c" stroke-width="3"/>' +
          '<circle cx="' + cx + '" cy="' + cy + '" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>' +
          '<text class="pan-num" x="' + cx + '" y="' + (cy + 12) + '" text-anchor="middle">' + n + "</text>";
        g.appendChild(grp);
      }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#pan-cam", { scale: 1.08, transformOrigin: "460px 900px" }, { scale: 1.2, duration: 3.6, ease: "none" }, 0);
      tl.fromTo("#pan-gleamr", { x: 0 }, { x: 1400, duration: 2.6, ease: "power1.inOut" }, 0.2);
      // Reach in, slow down near the button (anticipation), press, release.
      tl.fromTo("#pan-hand", { x: 1150, y: 1900 }, { x: 444, y: 1026, duration: 1.5, ease: "power3.out" }, 0.75);
      tl.to("#pan-hand", { x: 426, y: 1003, duration: 0.15, ease: "power2.in" }, 2.25);
      tl.to("#pan-b1", { scale: 0.93, svgOrigin: "430 1020", duration: 0.08 }, 2.36);
      tl.to(["#pan-glow", "#pan-ring"], { opacity: 1, duration: 0.12, ease: "power2.out" }, 2.4);
      tl.to("#pan-b1", { scale: 1, svgOrigin: "430 1020", duration: 0.2 }, 2.55);
      tl.to("#pan-hand", { x: 462, y: 1058, duration: 0.3, ease: "power2.out" }, 2.55);
      tl.to("#pan-hand", { x: 1150, y: 1950, duration: 0.6, ease: "power2.in" }, 2.95);
      window.__timelines["panel"] = tl;
    })();
  </script>
</template>
