        const a = Math.sin(k * 78.233) * 43758.5453, b = Math.sin(k * 12.9898) * 24634.6345;

        tl.set("#be-shake", { x: (a - Math.floor(a) - 0.5) * amp, y: (b - Math.floor(b) - 0.5) * amp }, k / 12);
