<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #05070b;
        --ink: #f2f4f7;
        --font-display: "Montserrat", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        background: var(--ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="59.7"
      data-width="1080"
      data-height="1920"
    >
      <div id="exterior" data-composition-id="exterior" data-composition-src="compositions/exterior.html"
        data-start="0" data-duration="5.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="panel" data-composition-id="panel" data-composition-src="compositions/panel.html"
        data-start="5.6" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="floors" data-composition-id="floors" data-composition-src="compositions/floors.html"
        data-start="9.2" data-duration="9.7" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="flicker" data-composition-id="flicker" data-composition-src="compositions/flicker.html"
        data-start="18.9" data-duration="7.1" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="corridor" data-composition-id="corridor" data-composition-src="compositions/corridor.html"
        data-start="26" data-duration="7.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="cctv" data-composition-id="cctv" data-composition-src="compositions/cctv.html"
        data-start="33.8" data-duration="13" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="behind" data-composition-id="behind" data-composition-src="compositions/behind.html"
        data-start="46.8" data-duration="8.15" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="54.95" data-duration="4.75" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="54.95" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="fx" data-composition-id="fx" data-composition-src="compositions/fx.html"
        data-start="0" data-duration="59.7" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:9"></div>

      <audio id="soundtrack" class="clip" src="assets/soundtrack.wav" data-start="0" data-duration="59.7"
        data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
