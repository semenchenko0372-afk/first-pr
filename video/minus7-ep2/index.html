<!doctype html>
<html lang="ru" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #05070b;
        --ink: #f2f4f7;
        --font-display: "Montserrat", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); background: var(--ground); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="61"
      data-width="1080"
      data-height="1920"
    >
      <div id="turn" data-composition-id="turn" data-composition-src="compositions/turn.html"
        data-start="0" data-duration="5.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="monitor" data-composition-id="monitor" data-composition-src="compositions/monitor.html"
        data-start="5.6" data-duration="15.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="run" data-composition-id="run" data-composition-src="compositions/run.html"
        data-start="21.4" data-duration="3.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="doors" data-composition-id="doors" data-composition-src="compositions/doors.html"
        data-start="24.6" data-duration="5.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="up" data-composition-id="up" data-composition-src="compositions/up.html"
        data-start="30.2" data-duration="10.6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="same" data-composition-id="same" data-composition-src="compositions/same.html"
        data-start="40.8" data-duration="9.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="nails" data-composition-id="nails" data-composition-src="compositions/nails.html"
        data-start="50" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="56" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="56" data-track-index="2" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="fx" data-composition-id="fx" data-composition-src="compositions/fx.html"
        data-start="0" data-duration="61" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:9"></div>

      <audio id="soundtrack" class="clip" src="assets/soundtrack.wav" data-start="0" data-duration="61"
        data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
