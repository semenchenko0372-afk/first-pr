  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      let seed = 88;
      const r = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      // Dust sifting off the fingertips, a function of time.
      const tips = [[388, 690], [499, 612], [609, 640], [710, 748]];
      const dust = [];
      const dg = document.getElementById("na-dust");
      for (let i = 0; i < 40; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("r", 1.5 + r() * 2.5);
        dg.appendChild(c);
        const tip = tips[i % 4];
        dust.push({ c, x: tip[0] + (r() - 0.5) * 40, y: tip[1] + 10, period: 1.6 + r() * 1.4, ph: r() * 3 });
      }
      function drawDust(t) {
        for (const d of dust) {
          const k = ((t + d.ph) % d.period) / d.period;
          d.c.setAttribute("cx", d.x + Math.sin((t + d.ph) * 2) * 4);
          d.c.setAttribute("cy", d.y + k * 260);
          d.c.setAttribute("opacity", 0.7 * (1 - k));
        }
      }
      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: 6, duration: 6, ease: "none", onUpdate: () => drawDust(st.t) }, 0);
      // The hand rises into the torchlight, then we close on the nails.
      tl.fromTo("#na-hand", { y: 900 }, { y: 0, duration: 1.4, ease: "power3.out" }, 0.1);
      tl.fromTo("#na-cam", { scale: 1.0, transformOrigin: "540px 800px" }, { scale: 1.08, duration: 2.5, ease: "none" }, 0);
      tl.to("#na-cam", { scale: 1.75, transformOrigin: "560px 700px", duration: 2.8, ease: "power2.inOut" }, 2.6);
      // A tremor, out of step finger to finger.
      for (let k = 0; k < 72; k++) {
        const t = k / 12;
        ["#na-f1", "#na-f2", "#na-f3", "#na-f4"].forEach((id, i) => {
          const a = Math.sin(k * 12.9898 + i * 78.233) * 43758.5453;
          tl.set(id, { y: (a - Math.floor(a) - 0.5) * 6 }, t);
        });
      }
      drawDust(0);
      window.__timelines["nails"] = tl;
    })();
  </script>
