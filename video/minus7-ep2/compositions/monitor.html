    (function () {
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const cv = document.getElementById("mo-noise");
      const ctx = cv.getContext("2d");
      const img = ctx.createImageData(cv.width, cv.height);
      const timeEl = document.getElementById("mo-time");
      let lastF = -1, lastS = -1;
      function draw(t) {
        const f = Math.floor(t * 24);
        if (f !== lastF) {
          lastF = f;
          const r = rng(777 + f * 131);
          const d = img.data;
          for (let i = 0; i < d.length; i += 4) { const v = (r() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
          ctx.putImageData(img, 0, 0);
        }
        const s = 16 + Math.floor(t);
        if (s !== lastS) { lastS = s; timeEl.textContent = "23:47:" + String(s).padStart(2, "0"); }
      }
      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: 15.8, duration: 15.8, ease: "none", onUpdate: () => draw(st.t) }, 0);
      tl.fromTo("#mo-roll", { y: 0 }, { y: 820, duration: 2.6, ease: "none", repeat: 2 }, 0);
      for (let k = 0; k < 9; k++) {
        tl.set("#mo-rec", { opacity: 1 }, k);
        tl.set("#mo-rec", { opacity: 0.15 }, k + 0.5);
      }
      tl.set("#mo-fig", { opacity: 1 }, 0);
      // Back on the feed: you, and it.
      tl.fromTo("#mo-cam", { scale: 1.55, transformOrigin: "590px 640px" }, { scale: 1.7, duration: 2.1, ease: "none" }, 0);
      tl.to("#mo-cam", { scale: 2.1, transformOrigin: "520px 560px", duration: 3.2, ease: "power1.inOut" }, 2.15);
      // It lifts its face to the lens.
      tl.to("#mo-figface", { opacity: 1, duration: 0.12 }, 5.95);
      tl.set("#mo-figeyes", { opacity: 0 }, 5.95);
      [[5.95, 18], [6.02, -24], [6.08, 10], [6.16, 0]].forEach(([t, x]) => tl.set("#mo-feed", { x }, t));
      tl.set("#mo-flash", { opacity: 0.5 }, 5.95);
      tl.set("#mo-flash", { opacity: 0 }, 6.02);
      tl.set("#mo-noise", { opacity: 0.45 }, 5.95);
      tl.to("#mo-noise", { opacity: 0.16, duration: 0.6 }, 6.05);
      tl.to("#mo-cam", { scale: 3.6, transformOrigin: "500px 430px", duration: 2.5, ease: "power2.in" }, 6.1);
      // The screen dies: back off, collapse to a line, then a dot.
      tl.set("#mo-cam", { scale: 1.12, transformOrigin: "540px 640px" }, 8.7);
      tl.set("#mo-off", { opacity: 1, scaleY: 1, scaleX: 1, svgOrigin: "540 640" }, 8.72);
      tl.set(["#mo-feed", "#mo-noise", "#mo-lines"], { opacity: 0 }, 8.72);
      tl.set("#mo-glass", { opacity: 1 }, 8.72);
      tl.to("#mo-off", { scaleY: 0.012, duration: 0.14, ease: "power3.in" }, 8.74);
      tl.to("#mo-off", { scaleX: 0.0, duration: 0.16, ease: "power3.in" }, 8.9);
      tl.set("#mo-off", { opacity: 0 }, 9.08);
      tl.set(["#mo-rec", "#mo-date", "#mo-time"], { opacity: 0 }, 8.72);
      tl.set(".mo-hud", { opacity: 0 }, 8.72);
      // In the black glass: your reflection, then its.
      tl.to("#mo-cam", { scale: 1.4, transformOrigin: "540px 640px", duration: 4.25, ease: "power1.inOut" }, 9.6);
      tl.fromTo("#mo-refl", { opacity: 0 }, { opacity: 0.55, duration: 1.6, ease: "power1.in" }, 10.4);
      tl.set("#mo-ghostr", { opacity: 0.5 }, 13.85);
      tl.set("#mo-ghostr", { opacity: 0.1 }, 13.92);
      tl.set("#mo-ghostr", { opacity: 0.85 }, 14.0);

      tl.set("#mr-mO", { opacity: 1, scale: 0.6, transformOrigin: "50% 50%" }, 14.1);
      draw(0);

    })();
