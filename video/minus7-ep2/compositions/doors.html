<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    .dr-shot { position: absolute; inset: 0; }
    .dr-svg { position: absolute; inset: 0; width: 1080px; height: 1920px; }

    
    #dp-cam { position: absolute; inset: 0; }
    #dp-svg { position: absolute; inset: 0; width: 1080px; height: 1920px; }
    .dp-num { font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 34px; fill: #2c333b; }
    </style>
  <div id="root" data-composition-id="doors" data-width="1080" data-height="1920">
    <!-- Shot B: the panel, pressed again and again -->
    <div id="dr-b" class="dr-shot" data-layout-allow-overflow>
      <div id="dp-cam" data-layout-allow-overflow style="position:absolute; inset:0;">
      <svg id="dp-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="dp-wall" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3d454f" />
            <stop offset="0.35" stop-color="#6c7682" />
            <stop offset="0.55" stop-color="#7d8793" />
            <stop offset="1" stop-color="#3a414b" />
          </linearGradient>
          <linearGradient id="dp-plate" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#b7c0c9" />
            <stop offset="0.5" stop-color="#8d97a2" />
            <stop offset="1" stop-color="#5f6872" />
          </linearGradient>
          <radialGradient id="dp-btn" cx="0.35" cy="0.3" r="0.8">
            <stop offset="0" stop-color="#f1f4f7" />
            <stop offset="0.55" stop-color="#b9c1ca" />
            <stop offset="1" stop-color="#6e7781" />
          </radialGradient>
          <radialGradient id="dp-top" cx="0.5" cy="0" r="0.9">
            <stop offset="0" stop-color="#fff6e0" stop-opacity="0.45" />
            <stop offset="1" stop-color="#fff6e0" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="dp-amber" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ffb648" stop-opacity="0.9" />
            <stop offset="1" stop-color="#ffb648" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="dp-gleam" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="dp-sleeve" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5d7a53" />
            <stop offset="1" stop-color="#3a5134" />
          </linearGradient>
          <filter id="dp-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-18" dy="26" stdDeviation="18" flood-color="#000" flood-opacity="0.45" /></filter>
          <filter id="dp-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" /></filter>
          <clipPath id="dp-plateclip"><rect x="300" y="200" width="480" height="920" rx="26" /></clipPath>
        </defs>
        <rect width="1080" height="1920" fill="url(#dp-wall)" />
        <g id="dp-streaks" opacity="0.18"></g>
        <rect width="1080" height="1920" fill="url(#dp-top)" />
        <!-- door seam on the left -->
        <rect x="70" y="0" width="6" height="1920" fill="#2a3038" />
        <rect x="78" y="0" width="2" height="1920" fill="#9aa4ae" opacity="0.5" />

        <!-- the panel -->
        <g filter="url(#dp-shadow)">
          <rect x="300" y="200" width="480" height="920" rx="26" fill="url(#dp-plate)" />
        </g>
        <rect x="300" y="200" width="480" height="920" rx="26" fill="none" stroke="#dfe5ea" stroke-opacity="0.6" stroke-width="3" />
        <g fill="#5a636d">
          <circle cx="330" cy="230" r="8" /><circle cx="750" cy="230" r="8" />
          <circle cx="330" cy="1090" r="8" /><circle cx="750" cy="1090" r="8" />
        </g>
        <!-- floor display -->
        <rect x="380" y="250" width="320" height="110" rx="12" fill="#120707" />
        <rect x="380" y="250" width="320" height="110" rx="12" fill="none" stroke="#3a4048" stroke-width="5" />
        <text x="540" y="333" text-anchor="middle" font-family="Space Mono, monospace" font-weight="700" font-size="76" fill="#ff3b30" opacity="0.95">−7</text>
        <text x="540" y="333" text-anchor="middle" font-family="Space Mono, monospace" font-weight="700" font-size="76" fill="#ff3b30" opacity="0.4" filter="url(#dp-blur)" data-layout-ignore>−7</text>
        <g id="dp-buttons"></g>
        <!-- glow ring for button 1 -->
        <circle id="dp-glow" cx="430" cy="1020" r="110" fill="url(#dp-amber)" opacity="0" />
        <circle id="dp-ring" cx="430" cy="1020" r="49" fill="none" stroke="#ffb648" stroke-width="6" opacity="0" />
        <g clip-path="url(#dp-plateclip)">
          <rect id="dp-gleamr" x="-300" y="150" width="220" height="1020" fill="url(#dp-gleam)" transform="skewX(-18)" />
        </g>

        <!-- hand: fingertip sits at the group origin -->
        <g id="dp-hand">
          <g transform="rotate(-42)">
            <rect x="-40" y="250" width="170" height="560" rx="30" fill="url(#dp-sleeve)" />
            <rect x="-46" y="232" width="182" height="60" rx="24" fill="#4a6542" />
            <!-- curled fingers sit to the right of the pointing finger -->
            <path d="M-16 118 C-20 100 6 96 30 104 L104 120 C126 126 132 150 128 176 C124 220 110 252 70 258 L-6 258 C-30 252 -34 220 -30 190 Z" fill="#dba27a" />
            <path d="M22 132 C48 128 86 134 116 146" stroke="#b47a55" stroke-width="5" fill="none" stroke-linecap="round" />
            <path d="M22 168 C50 164 88 170 122 182" stroke="#b47a55" stroke-width="5" fill="none" stroke-linecap="round" />
            <path d="M22 204 C50 200 86 206 116 216" stroke="#b47a55" stroke-width="5" fill="none" stroke-linecap="round" />
            <!-- index finger -->
            <path d="M-16 22 C-16 2 16 2 16 22 L18 140 L-18 140 Z" fill="#e3ad85" />
            <rect x="-10" y="8" width="20" height="24" rx="9" fill="#f3d1b8" />
            <path d="M-12 70 Q0 76 12 70" stroke="#c48c66" stroke-width="3" fill="none" />
            <!-- thumb wraps over the curled fingers -->
            <path d="M-34 236 C-46 200 -36 168 -8 160 C20 154 52 160 70 170 C80 178 74 190 60 190 C36 190 12 188 0 198 C-10 208 -12 230 -34 236 Z" fill="#cf946c" />
            <path d="M44 172 C58 172 70 176 72 182" stroke="#f0c9ab" stroke-width="4" fill="none" stroke-linecap="round" />
          </g>
        </g>
      </svg>
      </div>
    </div>
    <!-- Shot A: doors closing on the dark corridor -->
    <div id="dr-a" class="dr-shot" data-layout-allow-overflow>
      <svg class="dr-svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="dr-door" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#5a2b28" /><stop offset="0.5" stop-color="#8d4a44" /><stop offset="1" stop-color="#4a2220" />
          </linearGradient>
          <radialGradient id="dr-fog" cx="0.5" cy="0.6" r="0.5">
            <stop offset="0" stop-color="#7f93aa" stop-opacity="0.16" /><stop offset="1" stop-color="#7f93aa" stop-opacity="0" />
          </radialGradient>
          <filter id="dr-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" /></filter>
        </defs>
        <rect width="1080" height="1920" fill="#2a0c0a" />
        <rect x="150" y="240" width="780" height="1500" fill="#000" />
        <ellipse cx="540" cy="1100" rx="420" ry="360" fill="url(#dr-fog)" />
        <!-- far down the dark: a pale face, for a heartbeat -->
        <g id="dr-face" opacity="0" filter="url(#dr-soft)">
          <ellipse cx="540" cy="930" rx="34" ry="46" fill="#b9c3c7" />
          <ellipse cx="527" cy="922" rx="8" ry="12" fill="#020303" /><ellipse cx="553" cy="922" rx="8" ry="12" fill="#020303" />
          <path d="M520 990 L512 1120 M560 990 L568 1120 M540 976 L540 1160" stroke="#07090a" stroke-width="22" stroke-linecap="round" />
        </g>
        <g id="dr-dl"><rect x="150" y="240" width="390" height="1500" fill="url(#dr-door)" /><rect x="530" y="240" width="10" height="1500" fill="#1d0807" /></g>
        <g id="dr-dr"><rect x="540" y="240" width="390" height="1500" fill="url(#dr-door)" /><rect x="540" y="240" width="10" height="1500" fill="#1d0807" /></g>
        <rect x="0" y="0" width="150" height="1920" fill="#3d1512" />
        <rect x="930" y="0" width="150" height="1920" fill="#3d1512" />
        <rect x="0" y="0" width="1080" height="240" fill="#4a1a17" />
        <rect x="0" y="1740" width="1080" height="180" fill="#240908" />
        <rect x="150" y="1736" width="780" height="8" fill="#9a5a52" opacity="0.5" />
      </svg>
    </div>
  </div>
  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const r = rng(5);
      const st = document.getElementById("dp-streaks");
      for (let i = 0; i < 140; i++) {
        const l = document.createElementNS(NS, "rect");
        l.setAttribute("x", r() * 1080); l.setAttribute("y", 0);
        l.setAttribute("width", 1 + r() * 2); l.setAttribute("height", 1920);
        l.setAttribute("fill", r() < 0.5 ? "#ffffff" : "#000000");
        l.setAttribute("opacity", 0.2 + r() * 0.5);
        st.appendChild(l);
      }
      // Buttons 1–12, two columns, bottom to top.
      const g = document.getElementById("dp-buttons");
      for (let n = 1; n <= 12; n++) {
        const col = (n - 1) % 2, row = Math.floor((n - 1) / 2);
        const cx = 430 + col * 220, cy = 1020 - row * 120;
        const grp = document.createElementNS(NS, "g");
        if (n === 1) grp.setAttribute("id", "dp-b1");
        grp.innerHTML =
          '<circle cx="' + cx + '" cy="' + (cy + 4) + '" r="48" fill="#3f474f" opacity="0.6"/>' +
          '<circle cx="' + cx + '" cy="' + cy + '" r="46" fill="url(#dp-btn)" stroke="#59626c" stroke-width="3"/>' +
          '<circle cx="' + cx + '" cy="' + cy + '" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>' +
          '<text class="dp-num" x="' + cx + '" y="' + (cy + 12) + '" text-anchor="middle">' + n + "</text>";
        g.appendChild(grp);
      }

      const tl = gsap.timeline({ paused: true });
      // Shot A: doors slide shut from open; something stands far down the corridor.
      tl.fromTo("#dr-dl", { x: -392 }, { x: 0, duration: 1.45, ease: "power2.inOut" }, 0.1);
      tl.fromTo("#dr-dr", { x: 392 }, { x: 0, duration: 1.45, ease: "power2.inOut" }, 0.1);
      tl.fromTo("#dr-a .dr-svg", { scale: 1.12, transformOrigin: "540px 1000px" }, { scale: 1.0, duration: 1.9, ease: "power1.out" }, 0);
      tl.set("#dr-face", { opacity: 0.85 }, 0.95);
      tl.set("#dr-face", { opacity: 0.2 }, 1.02);
      tl.set("#dr-face", { opacity: 0.9 }, 1.08);
      tl.set("#dr-face", { opacity: 0 }, 1.2);
      // the clunk shakes the cabin
      [[1.55, 10], [1.6, -8], [1.65, 4], [1.7, 0]].forEach(([t, y]) => tl.set("#dr-a .dr-svg", { y }, t));
      tl.set("#dr-a", { opacity: 0 }, 1.95);

      // Shot B: press, press, press.
      tl.fromTo("#dp-cam", { scale: 1.25, transformOrigin: "440px 980px" }, { scale: 1.4, duration: 3.65, ease: "none" }, 1.95);
      tl.fromTo("#dp-hand", { x: 1150, y: 1900 }, { x: 460, y: 1040, duration: 0.3, ease: "power3.out" }, 1.95);
      const presses = [2.3, 2.55, 2.8, 3.05, 3.8, 4.05, 4.3, 4.55];
      presses.forEach((t) => {
        tl.to("#dp-hand", { x: 426, y: 1003, duration: 0.07, ease: "power2.in" }, t - 0.07);
        tl.to("#dp-b1", { scale: 0.93, svgOrigin: "430 1020", duration: 0.05 }, t);
        tl.to("#dp-b1", { scale: 1, svgOrigin: "430 1020", duration: 0.08 }, t + 0.06);
        tl.to("#dp-hand", { x: 462, y: 1052, duration: 0.12, ease: "power2.out" }, t + 0.05);
      });
      tl.to(["#dp-glow", "#dp-ring"], { opacity: 1, duration: 0.1 }, 2.3);
      for (let k = 0; k < 14; k++) {
        const a = Math.sin(k * 51.3) * 43758.5453;
        tl.set("#dp-svg", { x: (a - Math.floor(a) - 0.5) * 8, y: Math.cos(k * 7.1) * 3 }, 2.3 + k * 0.17);
      }
      tl.set("#dp-svg", { x: 0, y: 0 }, 4.75);
      tl.fromTo("#dp-gleamr", { x: 0 }, { x: 1400, duration: 2.0, ease: "power1.inOut" }, 2.0);
      window.__timelines["doors"] = tl;
    })();
  </script>
</template>
