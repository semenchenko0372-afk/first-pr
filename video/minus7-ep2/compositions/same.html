  <script>
    (function () {
      
function drawTallies(p) {
  const NS = "http://www.w3.org/2000/svg";
  let seed = 19;
  const r = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const sc = document.getElementById(p + "-scratch");
  for (let k = 0; k < 16; k++) {
    const x0 = 30 + r() * 280, y0 = 880 + r() * 420, sy = 0.6 + (x0 / 390) * -0.2;
    for (let i = 0; i < 5; i++) {
      const l = document.createElementNS(NS, "line"), x = x0 + i * 10;
      l.setAttribute("x1", x); l.setAttribute("y1", y0 + x * 0.5 * sy);
      l.setAttribute("x2", x + 2); l.setAttribute("y2", y0 + 46 + x * 0.5 * sy);
      if (i === 4) { l.setAttribute("x1", x0 - 6); l.setAttribute("y1", y0 + 10); l.setAttribute("x2", x0 + 44); l.setAttribute("y2", y0 + 34); }
      sc.appendChild(l);
    }
  }
}

      drawTallies("sh");
      const NS = "http://www.w3.org/2000/svg";
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // Concrete grain and old, greyed tallies on the close wall.
      const r = rng(5);
      const g = document.getElementById("sm-grain");
      for (let i = 0; i < 900; i++) {
        const c = document.createElementNS(NS, "rect");
        c.setAttribute("x", r() * 1080); c.setAttribute("y", r() * 1920);
        const w = 2 + r() * 6; c.setAttribute("width", w); c.setAttribute("height", w);
        c.setAttribute("fill", r() < 0.5 ? "#2e3236" : "#6e747a"); c.setAttribute("opacity", 0.25 + r() * 0.4);
        g.appendChild(c);
      }
      const old = document.getElementById("sm-old");
      const spots = [[120, 640], [300, 700], [720, 680], [820, 900], [160, 1120], [700, 1180], [330, 1300], [860, 1300], [520, 1240], [120, 860], [760, 460], [300, 480]];
      spots.forEach(([x0, y0]) => {
        for (let i = 0; i < 5; i++) {
          const l = document.createElementNS(NS, "line");
          if (i < 4) { l.setAttribute("x1", x0 + i * 28); l.setAttribute("y1", y0); l.setAttribute("x2", x0 + i * 28 + 4); l.setAttribute("y2", y0 + 130); }
          else { l.setAttribute("x1", x0 - 20); l.setAttribute("y1", y0 + 40); l.setAttribute("x2", x0 + 110); l.setAttribute("y2", y0 + 90); }
          old.appendChild(l);
        }
      });
      // Dust shed by the new scratch, falling from time alone.
      const dust = [];
      const rd = rng(42);
      const dg = document.getElementById("sm-dust");
      for (let i = 0; i < 60; i++) {
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("r", 1.5 + rd() * 3);
        dg.appendChild(c);
        dust.push({ c, x: 420 + rd() * 160, y: 900 + rd() * 140, t0: 4.6 + (i % 5) * 0.35 + rd() * 0.3, v: 60 + rd() * 120 });
      }
      function drawDust(t) {
        for (const d of dust) {
          const k = t - d.t0;
          if (k < 0) { d.c.setAttribute("opacity", 0); continue; }
          d.c.setAttribute("cx", d.x + Math.sin(k * 3 + d.x) * 6);
          d.c.setAttribute("cy", d.y + d.v * k + 40 * k * k);
          d.c.setAttribute("opacity", Math.max(0, 0.9 - k * 0.3));
        }
      }
      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: 9.2, duration: 9.2, ease: "none", onUpdate: () => drawDust(st.t) }, 0);

      // Shot A: the doors part onto the same corridor, torch already on.
      tl.set("#sh-beam", { attr: { r: 520, cx: 540, cy: 980 } }, 0);
      tl.set("#sh-warmc", { attr: { r: 300, cx: 540, cy: 980 } }, 0);
      tl.fromTo("#sm-dl", { x: 0 }, { x: -392, duration: 1.6, ease: "power2.inOut" }, 0.2);
      tl.fromTo("#sm-dr", { x: 0 }, { x: 392, duration: 1.6, ease: "power2.inOut" }, 0.2);
      tl.fromTo("#sm-hallsvg", { scale: 1.0, transformOrigin: "540px 900px" }, { scale: 1.25, duration: 4.0, ease: "power1.inOut" }, 0);
      tl.set("#sm-doors", { opacity: 0 }, 2.2);
      // Shot B: the torch finds the left wall.
      tl.to(["#sh-beam", "#sh-warmc"], { attr: { cx: 220, cy: 1080 }, duration: 1.2, ease: "power2.inOut" }, 2.7);
      tl.set("#sm-ab", { opacity: 0 }, 4.0);

      // Shot C: close on the wall; a new tally is cut, stroke by stroke.
      tl.fromTo("#sm-wallsvg", { scale: 1.0, transformOrigin: "500px 970px" }, { scale: 1.35, duration: 3.6, ease: "power1.inOut" }, 4.0);
      ["#sm-n1", "#sm-n2", "#sm-n3", "#sm-n4", "#sm-n5"].forEach((id, i) => {
        tl.fromTo(id, { attr: { "stroke-dasharray": "260 260", "stroke-dashoffset": 260 } },
          { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.in" }, 4.6 + i * 0.35);
      });
      tl.fromTo("#sm-newglow", { opacity: 0 }, { opacity: 0.5, duration: 0.6 }, 6.4);
      tl.to("#sm-wallsvg", { scale: 1.7, transformOrigin: "500px 970px", duration: 1.5, ease: "power2.out" }, 7.6);
      window.__timelines["same"] = tl;
    })();
